# Text attacker (speaker verification from transcripts only), Track 1.
# Run with: python run_text_attacker.py --config configs/track1/eval_text.yaml
# See text_attacker/README.md.
data_dir: data
exp_dir: exp
track: track1

anon_data_suffix: '' # '' evaluates reference transcripts (and ASR transcripts of the original audio, if present); set e.g. _mcadams to add the anonymized condition

text_backbone: BAAI/bge-m3 # Hugging Face model id or local directory
text_backbone_revision: 5617a9f61b028005a4858fdac845db406aefb181
hyp_norm: head # normalization of ASR transcripts: head (the convention the head was trained on), none, upper_letters or lower_letters

datasets:
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_mixed]

privacy:
  text_attacker:
    dataset_name: [libri_dev, libri_test]
    backbone: !ref <text_backbone>
    backbone_revision: !ref <text_backbone_revision>
    heads: # one head per dataset prefix
      libri:
        head_dir: !ref <exp_dir>/text_attacker/heads/libri

    evaluation:
      results_dir: !ref <exp_dir>/text_attacker/results/<track>
      cache_dir: !ref <exp_dir>/text_attacker/feat_cache # pooled encoder features, keyed by the text
      asr_text_dir: !ref <exp_dir>/asr # results_dir of the ASR evaluation
      scenarios: # [enrollment text, trial text]
        - [ref, ref]
        - [ref, asr_orig]
        - [ref, asr_anon]
      hyp_norm: !ref <hyp_norm>
      on_missing_hypothesis: skip # skip or error, when the ASR evaluation has not been run
      canary_check: true
      eval_batchsize: 32
