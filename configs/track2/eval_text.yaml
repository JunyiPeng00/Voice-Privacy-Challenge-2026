# Text attacker (speaker verification from transcripts only), Track 2.
# Run with: python run_text_attacker.py --config configs/track2/eval_text.yaml
# See text_attacker/README.md.
data_dir: data
exp_dir: exp
track: track2

anon_data_suffix: '' # '' evaluates reference transcripts (and ASR transcripts of the original audio, if present); set e.g. _mcadams to add the anonymized condition

text_backbone: BAAI/bge-m3 # Hugging Face model id or local directory
text_backbone_revision: 5617a9f61b028005a4858fdac845db406aefb181
hyp_norm: head # normalisation of ASR transcripts: head (the convention the head was trained on), none, upper_letters or lower_letters

datasets:
  - name: en_dev
    data: en_dev
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: en_test
    data: en_test
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: de_dev
    data: de_dev
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: de_test
    data: de_test
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: es_dev
    data: es_dev
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: es_test
    data: es_test
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: fr_dev
    data: fr_dev
    enrolls: [_enrolls]
    trials: [_trials_mixed]
  - name: fr_test
    data: fr_test
    enrolls: [_enrolls]
    trials: [_trials_mixed]

privacy:
  text_attacker:
    dataset_name: [en_dev, en_test, de_dev, de_test, es_dev, es_test, fr_dev, fr_test]
    backbone: !ref <text_backbone>
    backbone_revision: !ref <text_backbone_revision>
    heads: # one head per dataset prefix
      en:
        head_dir: !ref <exp_dir>/text_attacker/heads/en
      de:
        head_dir: !ref <exp_dir>/text_attacker/heads/de
      es:
        head_dir: !ref <exp_dir>/text_attacker/heads/es
      fr:
        head_dir: !ref <exp_dir>/text_attacker/heads/fr

    evaluation:
      results_dir: !ref <exp_dir>/text_attacker/results/<track>
      cache_dir: !ref <exp_dir>/text_attacker/feat_cache # pooled encoder features, keyed by the text
      asr_text_dir: !ref <exp_dir>/openai/whisper-large-v3 # results_dir of the ASR evaluation
      scenarios: # [enrolment text, trial text]
        - [ref, ref]
        - [ref, asr_orig]
        - [ref, asr_anon]
      hyp_norm: !ref <hyp_norm>
      on_missing_hypothesis: skip # skip or error, when the ASR evaluation has not been run
      canary_check: true
      eval_batchsize: 32
